function ball(k,v,o){

  if(v==4)bs.x4++;if(v==6)bs.x6++}

 else{
  out=true;
  if(o.ty=='Run out'){rn=o.rn||0;i.r+=rn;bs.r+=rn;bo.r+=rn;if(o.who=='ns'&&i.ns>=0)d=i.ns}
  else bo.w++;
  tok='W'+(rn?'+'+rn:'');
 }
 if(legal){i.b++;bs.b++;bo.b++;if(k!='nb')i.fh=0}
 if(out){i.w++;var dm=i.bs[d];dm.o=o.ty||'Out';dm.bb=bo.n}
 i.ball.push(tok);
 var tx,ov=overs(i.b);
 if(k=='r')tx=v==0?'Dot ball. '+bo.n+' to '+bs.n:v==1?bs.n+' takes a single':v==4?bs.n+' hits a FOUR!':v==6?bs.n+' hits a SIX!':bs.n+' runs '+(v==2?'two':'three');
 else if(k=='by'||k=='lb')tx=v+(k=='by'?' bye':' leg bye')+(v>1?'s':'');
 else if(k=='wd')tx='Wide from '+bo.n;
 else if(k=='nb')tx='No ball from '+bo.n+(i.fh?'. Free hit next!':'');
 else{var ty=o.ty||'Out';
  tx=ty=='Run out'?dm.n+' is RUN OUT!'+(rn?' ('+rn+' run'+(rn>1?'s':'')+' completed)':''):ty=='Bowled'?dm.n+' is OUT, bowled by '+bo.n+'!':ty=='Caught'?dm.n+' is OUT, caught! '+bo.n+' gets the wicket':ty=='Stumped'?dm.n+' is OUT, stumped!':ty=='LBW'?dm.n+' is OUT, LBW to '+bo.n+'!':dm.n+' is OUT, '+ty.toLowerCase()+'!';}
 cmt(tx,ov);
 if(k=='r'&&pr0<100&&bs.r>=100)cmt(bs.n+' reaches HUNDRED!',ov);
 else if(k=='r'&&pr0<50&&bs.r>=50)cmt(bs.n+' reaches FIFTY!',ov);
 var st=status();
 if(out){vib([200,80,200]);
  if(/^(Bowled|Stumped|Hit wicket|Run out)$/.test(o.ty)){snd('S');setTimeout(function(){snd('W')},450)}
  else snd('W')}
 else if(k=='nb'){vib(120);snd('N')}
 else if(k=='r'&&(v==4||v==6)){vib(60);snd(String(v))}
 if(!st){
  if(out){
   if(rn%2==1&&i.ns>=0){var t0=i.st;i.st=i.ns;i.ns=t0}

   else{if(slot=='st'){i.st=i.ns;i.ns=-1}else i.ns=-1}
  }
  else if(legal&&rr%2==1&&i.ns>=0){var t=i.st;i.st=i.ns;i.ns=t}
  if(legal&&i.b%6==0){
   if(i.pn)i.oe=1;else if(i.ns>=0){var t2=i.st;i.st=i.ns;i.ns=t2}
   var sr=0,sw=0;i.os=i.os||[];i.os.forEach(function(x){sr+=x.r;sw+=x.w});
   i.os.push({b:bo.n,r:i.r-sr,w:i.w-sw,t:i.ball.join(' ')});
   cmt('End of over '+(i.b/6)+': '+(i.r-sr)+' run'+((i.r-sr)==1?'':'s')+(i.w-sw?', '+(i.w-sw)+' wkt'+((i.w-sw)>1?'s':''):'')+'. '+m.t[i.bat]+' '+i.r+'/'+i.w,overs(i.b));
   i.lb=i.bw;i.bw=-1;i.ball=[];

  else finish(st)
 }

 M.inn.forEach(function(i){
  i.bs.forEach(function(x){var k=i.bat+'|'+x.n.toLowerCase(),p=P[k]=P[k]||{n:x.n,t:i.bat,p:0,r:0,w:0};p.r+=x.r;p.p+=x.r+x.x4+2*x.x6});
  i.bo.forEach(function(x){var t=1-i.bat,k=t+'|'+x.n.toLowerCase(),p=P[k]=P[k]||{n:x.n,t:t,p:0,r:0,w:0};p.w+=x.w;p.p+=20*x.w});

function authCall(path,body){
 return fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+path+'?key='+FBKEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
  .then(function(r){return r.json()}).then(function(d){if(d.error)throw new Error(d.error.message||'error');return d});
}
function setAuth(d){AUTH={email:d.email,uid:d.localId,tok:d.idToken,ref:d.refreshToken,exp:Date.now()+(+d.expiresIn-60)*1000};sv('gully_auth',AUTH)}
function token(){
 if(!AUTH)return Promise.reject(new Error('login'));
 if(Date.now()<AUTH.exp)return Promise.resolve(AUTH.tok);
 return fetch('https://securetoken.googleapis.com/v1/token?key='+FBKEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(AUTH.ref)})
  .then(function(r){return r.json()}).then(function(d){
   if(d.error)throw new Error('session');
   AUTH.tok=d.id_token;AUTH.ref=d.refresh_token;AUTH.exp=Date.now()+(+d.expires_in-60)*1000;sv('gully_auth',AUTH);return AUTH.tok});
}
function dbGet(path){return fetch(DB+path+'.json').then(function(r){return r.json()})}
function dbPut(path,data){
 return token().then(function(t){return fetch(DB+path+'.json?auth='+t,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})})
  .then(function(r){if(!r.ok)throw new Error('db');return r.json()});
}
function friendly(e){
 var t=String(e&&e.message||'');
 if(/EMAIL_EXISTS/.test(t))return'This email is already registered. Use Login.';
 if(/INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(t))return'Wrong email or password.';
 if(/WEAK_PASSWORD/.test(t))return'Password must be at least 6 characters.';
 if(/INVALID_EMAIL|MISSING_EMAIL/.test(t))return'Check the email address.';
 if(/TOO_MANY/.test(t))return'Too many tries. Wait a little and try again.';
 if(t=='db')return'Could not save. Check the database rules.';
 return'Something went wrong. Check internet and try again.';
}

 Object.keys(M).forEach(function(k){var x=M[k];t.m++;['r','b','x4','x6','w','rc','bb','mom'].forEach(function(f){t[f]+=(x[f]||0)});if((x.r||0)>t.hs)t.hs=x.r});
 return t;

function pushStats(M){
 if(!AUTH||!M.live||M.so)return;
 dbGet('/profiles').then(function(P){
  P=P||{};var by={},S={};
  Object.keys(P).forEach(function(u){by[String(P[u].n||'').toLowerCase()]=u});
  function g(n){var u=by[String(n).toLowerCase()];if(!u)return null;return S[u]=S[u]||{r:0,b:0,x4:0,x6:0,w:0,rc:0,bb:0,mom:0}}
  M.inn.forEach(function(i){
   i.bs.forEach(function(b){var s=g(b.n);if(s){s.r+=b.r;s.b+=b.b;s.x4+=b.x4;s.x6+=b.x6}});
   i.bo.forEach(function(b){var s=g(b.n);if(s){s.w+=b.w;s.rc+=b.r;s.bb+=b.b}});
  });
  var mo=motm(M);if(mo){var s=g(mo.n);if(s)s.mom=1}
  Object.keys(S).forEach(function(u){S[u].d=Date.now();dbPut('/stats/'+u+'/m/'+M.live,S[u]).catch(function(){})});
 }).catch(function(){});
}

 (m.cur==1?'<div class="meta">'+esc(m.t[m.inn[0].bat])+' scored '+m.inn[0].r+'/'+m.inn[0].w+'</div>':'')+
 '<div class="meta" style="margin-top:12px">Live match ID: <b>'+(m.live?esc(m.live):'not live')+'</b></div></div>'+
 '<button class="big" id="rc">Continue match</button>'+
 '<button class="big alt" id="rl">'+(m.live?'Share live link / QR':'Go live and share')+'</button>'+
 '<button class="big alt" id="rn">Start new match</button><div class="card" style="margin-top:14px"><h2>Ongoing matches</h2><div id="onl"></div></div>';
 $('rc').onclick=function(){resumePrompt=false;render()};
 $('rl').onclick=openShare;
 fillLive();
 $('rn').onclick=function(){
  if(confirm('Start a new match? The running match will be removed from this phone.')){
   m=null;undo=[];pend=null;rm(KEY_M);rm('gully_undo');resumePrompt=false;render()}};
}

function gate(){
 app.innerHTML='<div class="top"><h1 class="brand">Gully Cricket</h1></div><div id="mex"></div>';
 loginForm();
}
function render(){
 if(!AUTH&&!wc&&FBKEY.indexOf('PASTE')!==0)return gate();
 if(!m)return home();
 if(resumePrompt&&!m.done)return resume();
 if(m.done)return result();
 score();
}
loadProf();
var wc=null;try{wc=new URLSearchParams(location.search).get('c')}catch(e){}
if(wc)watch(wc.toUpperCase());else render();
})();
</script>
