<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1c2530">
<title>Gully Cricket Score</title>
<style>
:root{--ink:#1c2530;--wall:#dfe5e8;--card:#f7f9fa;--ball:#e4e12a;--wkt:#d6372b;--mute:#5d6b78;--line:#b9c4cb}
@media (prefers-color-scheme:dark){:root{--ink:#eef2f4;--wall:#141b22;--card:#1e2832;--mute:#9aa8b4;--line:#34424e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--wall);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{max-width:520px;margin:0 auto;padding:14px 14px 40px}
h1,h2{margin:0;font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-weight:400;letter-spacing:.5px}
h1{font-size:30px}h2{font-size:22px;margin-bottom:6px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=number],input[type=datetime-local],textarea{width:100%;padding:12px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:var(--wall);color:var(--ink);font-family:inherit}
textarea{min-height:90px}
.row{display:flex;gap:10px}.row>*{flex:1}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;margin:10px 0}
.chk input{width:22px;height:22px;accent-color:var(--wkt)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;color:var(--ink)}
.big{width:100%;padding:16px;font-size:18px;font-weight:700;background:var(--ball);color:#1c2530;margin-top:8px}
.big:disabled{opacity:.4}
.alt{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.ghost{background:transparent;border:1.5px solid var(--line);padding:9px 14px;font-size:14px}
.score{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:76px;line-height:1;letter-spacing:1px}
.score small{font-size:30px;color:var(--mute)}
.meta{color:var(--mute);font-size:15px;margin-top:6px}
.target{margin-top:10px;padding:8px 12px;background:var(--ball);color:#1c2530;border-radius:10px;font-weight:700;font-size:15px}
.fh{background:var(--wkt);color:#fff}
.ov{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;min-height:38px}
.b{min-width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:var(--wall);border:1.5px solid var(--line);padding:0 6px}
.b.w{background:var(--wkt);color:#fff;border-color:var(--wkt)}
.b.x{background:var(--ball);color:#1c2530;border-color:var(--ball)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pad button{height:68px;font-size:26px;font-weight:700;background:var(--card);border:1.5px solid var(--line)}
.pad button:active{transform:scale(.95)}
.pad .f{background:var(--ball);color:#1c2530;border-color:var(--ball)}
.pad .o{background:var(--wkt);color:#fff;border-color:var(--wkt);font-size:22px}
.pad .s{font-size:17px}
.hist{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist:last-child{border:0}
.pick button{width:100%;padding:14px;margin-top:8px;text-align:left;font-size:16px;background:var(--wall);border:1.5px solid var(--line)}
.pick button:disabled{opacity:.4}
.pick .row button{margin-top:0;text-align:center}
.pick .pad button{margin-top:0;text-align:center}
.pick .big{background:var(--ball);color:#1c2530;text-align:center}
.pick input{margin-top:8px}
.pick .sel{background:var(--ball);color:#1c2530;border-color:var(--ball)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button,.pick .chips button{width:auto;margin:0;padding:8px 14px;font-size:14px;border-radius:20px;background:var(--wall);border:1.5px solid var(--line);text-align:center}
.coin{width:130px;height:130px;border-radius:50%;background:var(--ball);color:#1c2530;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;margin:18px auto;border:4px solid var(--ink)}
.coin.fl{animation:flip 1.2s ease-out}
@keyframes flip{from{transform:rotateY(0)}to{transform:rotateY(1080deg)}}
@media (prefers-reduced-motion:reduce){.coin.fl{animation:none}}
.res{font-size:26px;margin:6px 0 10px}
details{margin-top:12px}summary{cursor:pointer;font-size:15px;color:var(--mute)}
details div{font-size:14px;padding:3px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--wall);padding:10px 16px;border-radius:10px;font-size:14px;z-index:9}
</style>
</head>
<body>
<div id="app"></div>

/* ---------- Sounds (mp3 files in the sounds folder) ---------- */
var SF={'4':'six','6':'six','N':'noball','C':'coin'},AU={};
function snd(t){
 if(!ld('gully_snd',1))return;
 var f=SF[t];if(!f)return;
 try{
  var a=AU[f];if(!a){a=AU[f]=new Audio('sounds/'+f+'.mp3');a.preload='auto'}
  var c=a.cloneNode();var p=c.play();if(p&&p.catch)p.catch(function(){});
 }catch(e){}
}

m=ld(KEY_M,null);
if(m&&m.v!==3){m=null;rm(KEY_M)}
if(m)undo=ld('gully_undo',[]);
function pushIndex(c){
 var i=c.inn[c.cur],sm;
 if(c.done)sm=c.res;
 else if(i.op)sm='Starting soon';
 else sm=c.t[i.bat]+' '+i.r+'/'+i.w+' ('+overs(i.b)+')'+(c.cur==1?' - target '+(c.inn[0].r+1):'');
 fetch(DB+'/live_index/'+c.live+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({a:c.t[0],b:c.t[1],s:sm,x:c.so?'Super Over':'Innings '+(c.cur+1),d:c.done?1:0,ts:Date.now()})}).catch(function(){});
}
function push(){
 if(!m||!m.live||!navigator.onLine)return;
 try{
  var c=JSON.parse(JSON.stringify(m));delete c.hbak;delete c.sum0;delete c.ro;
  pushIndex(c);
  fetch(DB+'/live/'+m.live+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)}).catch(function(){});
 }catch(e){}
}
function save(){sv(KEY_M,m);sv('gully_undo',undo.slice(-40));push()}
function pb(n){return{n:n,r:0,b:0,x4:0,x6:0,o:0}}
function pw(n){return{n:n,b:0,r:0,w:0}}
function mkInn(bat){return{bat:bat,r:0,w:0,b:0,ball:[],bs:[],bo:[],st:-1,ns:-1,pn:0,oe:0,bw:-1,lb:-1,fh:0,op:1,os:[]}}

 var lv=document.getElementById('lv');

function dis(x){

/* ---------- Toss ---------- */
function toss(cfg){
 var A=cfg.t[0];
 app.innerHTML='<div class="top"><h1>Toss</h1><button class="ghost" id="bk">Back</button></div><div class="card" style="text-align:center"><div class="meta">'+esc(A)+', call it</div><div class="coin" id="coin">?</div><div class="row"><button class="big" id="hd">Heads</button><button class="big" id="tl">Tails</button></div></div>';
 document.getElementById('bk').onclick=function(){render()};
 function flip(call){
  var coin=document.getElementById('coin'),face=Math.random()<0.5?0:1,w=face==call?0:1;
  document.getElementById('hd').onclick=null;document.getElementById('tl').onclick=null;
  coin.textContent='';coin.className='coin fl';snd('C');setTimeout(function(){snd('D')},1000);
  setTimeout(function(){
   var W=cfg.t[w],fc=face?'TAILS':'HEADS';
   app.innerHTML='<div class="top"><h1>Toss</h1></div><div class="card" style="text-align:center"><div class="coin">'+fc+'</div><h2>'+esc(W)+' won the toss</h2><div class="meta">Choose to</div><div class="row"><button class="big" id="bt">Bat first</button><button class="big" id="bl">Bowl first</button></div></div>';
   function go(bat){var first=bat?w:1-w;cfg.first=first;cfg.toss=W+' won the toss and chose to '+(bat?'bat':'bowl');
    cfg.inn=[mkInn(first),mkInn(1-first)];
    if(cfg.up){try{fetch(DB+'/upcoming/'+cfg.up+'.json',{method:'DELETE'}).catch(function(){})}catch(e){}}
    delete cfg.up;pre=null;m=cfg;undo=[];save();render()}
   document.getElementById('bt').onclick=function(){go(1)};
   document.getElementById('bl').onclick=function(){go(0)};
  },1300);
 }

 document.getElementById('tl').onclick=function(){flip(1)};
}

}

  var key=Object.keys(t).filter(function(x){return x.toLowerCase()==name.toLowerCase()})[0]||name,cur=t[key]||[],seen={};
  cur.forEach(function(n){seen[n.toLowerCase()]=1});
  roster(k).forEach(function(n){if(!seen[n.toLowerCase()]){seen[n.toLowerCase()]=1;cur.push(n)}});

 });

function cmt(t,o){m.cm=m.cm||[];m.cm.push({o:o||'',t:t});if(m.cm.length>60)m.cm.shift()}
function roster(t){
 var seen={},out=[],skip=/^(Batsman|Bowler) \d+$/;
 function add(n){var k=n.toLowerCase();if(!seen[k]&&!skip.test(n)){seen[k]=1;out.push(n)}}
 ((m.ro||[])[t]||[]).forEach(add);
 var sT=teams();Object.keys(sT).forEach(function(k){if(k.toLowerCase()==String(m.t[t]).toLowerCase())sT[k].forEach(add)});
 m.inn.forEach(function(x){
  if(x.bat==t)x.bs.forEach(function(p){add(p.n)});
  if(1-x.bat==t)x.bo.forEach(function(p){add(p.n)});
 });
 return out;
}

   var bats=[i.st,i.ns].filter(function(x){return x>=0&&i.bs[x]}).map(function(x){var b=i.bs[x];return'<div class="hist"><span>'+(x==i.st?'&#9733; ':'')+esc(b.n)+'</span><b>'+b.r+' ('+b.b+')</b></div>'}).join('');
   var bw=i.bw>=0&&i.bo[i.bw]?'<div class="hist"><span>Bowling: '+esc(i.bo[i.bw].n)+'</span><b>'+overs(i.bo[i.bw].b)+'-'+i.bo[i.bw].r+'-'+i.bo[i.bw].w+'</b></div>':'';
   h+='<div class="card"><div class="meta"><b>'+esc(M.t[i.bat])+'</b> batting</div><div class="score">'+i.r+'<small>/'+i.w+'</small></div><div class="meta">Overs '+overs(i.b)+' of '+M.ov+'</div>'+
   (tgt?'<div class="target">Need '+Math.max(tgt-i.r,0)+' off '+bl+' balls</div>':'')+
   '<div class="ov">'+i.ball.map(function(t){return'<div class="b '+(/^W(\+|$)/.test(t)?'w':(/^(Wd|Nb|B|LB)/.test(t)?'x':''))+'">'+t+'</div>'}).join('')+'</div>'+bats+bw+'</div>';
  }
  var cm=(M.cm||[]).slice().reverse().slice(0,20);
  if(cm.length)h+='<div class="card"><h2>Commentary</h2>'+cm.map(function(c){return'<div class="hist"><span style="min-width:44px;color:var(--mute)">'+esc(c.o||'')+'</span><span style="flex:1">'+(/!/.test(c.t)?'<b>'+esc(c.t)+'</b>':esc(c.t))+'</span></div>'}).join('')+'</div>';
  M.inn.forEach(function(x){if(x.bs.length)h+=sheet(M,x)});
  app.innerHTML=h;
  var wb=document.getElementById('wb');if(wb)wb.onclick=function(){clearInterval(wTimer);home()};
 }
 function poll(){
  fetch(DB+'/live/'+code+'.json').then(function(r){return r.json()}).then(draw).catch(function(){});
 }
 clearInterval(wTimer);draw(null);poll();wTimer=setInterval(poll,3000);
}

/* ---------- Resume screen (match already running when app opens) ---------- */
var resumePrompt=!!(m&&!m.done);
function copyText(t){
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('Link copied')},function(){toast('Copy failed')});return}}catch(e){}
 try{var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Link copied')}catch(e){toast('Copy failed')}
}
function openShare(){
 if(!m.live){m.live=Math.random().toString(36).slice(2,7).toUpperCase();save()}
 var url=LIVE_URL+'?c='+m.live,qr='';
 try{var q=qrcode(0,'M');q.addData(url);q.make();qr='<img alt="QR code" src="'+q.createDataURL(6,4)+'" style="width:240px;height:240px;image-rendering:pixelated;background:#fff;border-radius:10px">'}catch(e){}
 app.innerHTML='<div class="top"><h1>Share live match</h1></div>'+
 '<div class="card" style="text-align:center"><div class="meta">'+esc(m.t[0])+' v '+esc(m.t[1])+'</div><div class="meta">Scan this QR to watch live</div><div style="margin:12px 0">'+qr+'</div>'+
 '<div class="meta">Match ID</div><div class="res" style="margin:2px 0 8px">'+esc(m.live)+'</div><div class="meta" style="word-break:break-all;user-select:all">'+esc(url)+'</div></div>'+
 '<button class="big" id="shl">Share link</button><button class="big alt" id="cpl">Copy link</button><button class="big alt" id="bkl">Back</button>';
 document.getElementById('shl').onclick=function(){share('Watch live: '+m.t[0]+' v '+m.t[1]+'\n'+url)};
 document.getElementById('cpl').onclick=function(){copyText(url)};
 document.getElementById('bkl').onclick=function(){render()};
}
var lvT=null;
var pre=null;
function evList(o){return Object.keys(o||{}).map(function(k){var x=o[k];if(x&&typeof x=='object')x.c=k;return x}).filter(function(x){return x&&x.a&&x.b})}
function fillLive(){
 if(!document.getElementById('onl')&&!document.getElementById('rsl'))return;
 fetch(DB+'/live_index.json?orderBy=%22ts%22&startAt='+(Date.now()-43200000)).then(function(r){return r.json()}).then(function(o){
  var el=document.getElementById('onl'),rl=document.getElementById('rsl');
  var a=evList(o).sort(function(a,b){return b.ts-a.ts}),on=a.filter(function(x){return !x.d}),fin=a.filter(function(x){return x.d});
  function row(x,btn){return'<div class="hist"><div><b>'+esc(x.a)+' v '+esc(x.b)+'</b><div class="meta">'+(x.d?'Final: ':'')+esc(x.s||'')+(x.d?'':' &middot; '+esc(x.x||''))+'</div></div><button class="ghost" data-w="'+esc(x.c)+'">'+btn+'</button></div>'}
  if(el)el.innerHTML=on.length?on.map(function(x){return row(x,'Watch')}).join(''):'<div class="meta">No live matches right now</div>';
  if(rl)rl.innerHTML=fin.length?'<div class="meta" style="margin-bottom:4px">Recent results (all users)</div>'+fin.map(function(x){return row(x,'View')}).join('')+'<div class="meta" style="margin:10px 0 4px">On this phone</div>':'';
  app.querySelectorAll('[data-w]').forEach(function(b){b.onclick=function(){watch(b.dataset.w,true)}});
  clearTimeout(lvT);lvT=setTimeout(fillLive,8000);
 }).catch(function(){var el=document.getElementById('onl');if(el)el.innerHTML='<div class="meta">Cannot load live matches (offline)</div>'});
}
function fillUp(){
 fetch(DB+'/upcoming.json?orderBy=%22at%22&startAt='+(Date.now()-10800000)).then(function(r){return r.json()}).then(function(o){
  var el=document.getElementById('upl');if(!el)return;
  var a=evList(o).sort(function(a,b){return a.at-b.at});
  el.innerHTML=a.length?a.map(function(x){
   var when=new Date(x.at).toLocaleString([],{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
   return'<div class="hist"><div><b>'+esc(x.a)+' v '+esc(x.b)+'</b><div class="meta">'+esc(when)+' &middot; '+(x.ov||6)+' overs'+(x.v?' &middot; '+esc(x.v):'')+'</div></div><div style="display:flex;gap:6px;align-items:flex-start"><button class="ghost" data-us="'+esc(x.c)+'">Start</button><button class="ghost" data-ud="'+esc(x.c)+'">Remove</button></div></div>'}).join(''):'<div class="meta">No upcoming matches</div>';
  var map={};a.forEach(function(x){map[x.c]=x});
  el.querySelectorAll('[data-us]').forEach(function(b){b.onclick=function(){var x=map[b.dataset.us];pre={a:x.a,b:x.b,ov:x.ov||6,pl:x.pl||6,up:x.c};home()}});
  el.querySelectorAll('[data-ud]').forEach(function(b){b.onclick=function(){
   if(confirm('Remove this upcoming match?'))fetch(DB+'/upcoming/'+b.dataset.ud+'.json',{method:'DELETE'}).then(function(){fillUp()}).catch(function(){toast('Could not remove')})}});
 }).catch(function(){var el=document.getElementById('upl');if(el)el.innerHTML='<div class="meta">Cannot load upcoming matches (offline)</div>'});
}
function schedule(){
 var d=new Date(Date.now()+3600000);d.setMinutes(0,0,0);
 var pd=function(n){return(n<10?'0':'')+n};
 var def=d.getFullYear()+'-'+pd(d.getMonth()+1)+'-'+pd(d.getDate())+'T'+pd(d.getHours())+':'+pd(d.getMinutes());
 var nm=Object.keys(teams());
 app.innerHTML='<div class="top"><h1>Schedule match</h1><button class="ghost" id="bk">Back</button></div>'+
 '<div class="card"><div class="row"><div><label>Team A</label><input type="text" id="sa" placeholder="Team A name"></div><div><label>Team B</label><input type="text" id="sb" placeholder="Team B name"></div></div>'+
 (nm.length?'<div class="chips">'+nm.map(function(n){return'<button data-sc="'+esc(n)+'">'+esc(n)+'</button>'}).join('')+'</div>':'')+
 '<div class="row"><div><label>Overs per side</label><input type="number" id="so" value="6" min="1" max="50"></div><div><label>Players per side</label><input type="number" id="sp" value="6" min="2" max="11"></div></div>'+
 '<label>Date and time</label><input type="datetime-local" id="sw" value="'+def+'"><label>Venue (optional)</label><input type="text" id="sv" placeholder="Ground or colony name">'+
 '<button class="big" id="ssv">Schedule</button></div>';
 document.getElementById('bk').onclick=home;
 app.querySelectorAll('[data-sc]').forEach(function(b){b.onclick=function(){var a=document.getElementById('sa'),c=document.getElementById('sb');(a.value.trim()?c:a).value=b.dataset.sc}});
 document.getElementById('ssv').onclick=function(){
  var g=function(i){return document.getElementById(i).value};
  var at=new Date(g('sw')).getTime();
  if(!at||isNaN(at)){toast('Pick date and time');return}
  var id=Math.random().toString(36).slice(2,7).toUpperCase();
  fetch(DB+'/upcoming/'+id+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({a:g('sa').trim()||'Team A',b:g('sb').trim()||'Team B',ov:Math.max(1,+g('so')||6),pl:Math.min(11,Math.max(2,+g('sp')||6)),at:at,v:g('sv').trim(),ts:Date.now()})})
   .then(function(r){if(!r.ok)throw 0;toast('Match scheduled');home()}).catch(function(){toast('Could not schedule. Check internet and rules')});
 };
}
function resumeById(c){
 c=(c||'').trim().toUpperCase();
 if(c.length<4){toast('Enter the Match ID');return}
 fetch(DB+'/live/'+c+'.json').then(function(r){return r.json()}).then(function(d){
  if(!d||!d.inn){toast('Match not found');return}
  if(d.done){toast('That match is already finished');return}
  m=norm(d);m.live=c;m.v=3;undo=[];pend=null;rsOpen=false;resumePrompt=false;save();render();toast('Match resumed');
 }).catch(function(){toast('No internet')});
}
function shareLive(){
 if(!m.live){m.live=Math.random().toString(36).slice(2,7).toUpperCase();save()}
 share('Watch live: '+m.t[0]+' v '+m.t[1]+'\n'+LIVE_URL+'?c='+m.live);
}
function resume(){
 var i=m.inn[m.cur],tgt=m.cur==1?m.inn[0].r+1:0,started=!i.op;
 app.innerHTML='<div class="top"><h1>Match in progress</h1></div>'+
 '<div class="card"><div class="meta">'+esc(m.t[0])+' v '+esc(m.t[1])+' &middot; '+(m.so?'Super Over '+m.so:'Innings '+(m.cur+1))+'</div>'+
 (started?'<div class="meta"><b>'+esc(m.t[i.bat])+'</b> batting</div><div class="score">'+i.r+'<small>/'+i.w+'</small></div><div class="meta">Overs '+overs(i.b)+' of '+m.ov+'</div>'+(tgt?'<div class="target">Need '+Math.max(tgt-i.r,0)+' off '+(m.ov*6-i.b)+' balls</div>':''):'<div class="meta">'+esc(m.t[i.bat])+' to bat, innings not started yet</div>')+
 (m.cur==1?'<div class="meta">'+esc(m.t[m.inn[0].bat])+' scored '+m.inn[0].r+'/'+m.inn[0].w+'</div>':'')+
 '<div class="meta" style="margin-top:12px">Live match ID: <b>'+(m.live?esc(m.live):'not live')+'</b></div></div>'+
 '<button class="big" id="rc">Continue match</button>'+
 '<button class="big alt" id="rl">'+(m.live?'Share live link / QR':'Go live and share')+'</button>'+
 '<button class="big alt" id="rn">Start new match</button><div class="card" style="margin-top:14px"><h2>Ongoing matches</h2><div id="onl"></div></div>';
 document.getElementById('rc').onclick=function(){resumePrompt=false;render()};
 document.getElementById('rl').onclick=openShare;
 fillLive();
 document.getElementById('rn').onclick=function(){
  if(confirm('Start a new match? The running match will be removed from this phone.')){
   m=null;undo=[];pend=null;rm(KEY_M);rm('gully_undo');resumePrompt=false;render()}};
}

function render(){
 if(!m)return home();
 if(resumePrompt&&!m.done)return resume();
 if(m.done)return result();
 score();
}
var wc=null;try{wc=new URLSearchParams(location.search).get('c')}catch(e){}
if(wc)watch(wc.toUpperCase());else render();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
